<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Noise Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh; overflow: hidden;
      display: flex;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 310px; min-width: 310px; height: 100vh;
      background: #0f1b33; border-right: 1px solid #0f3460;
      overflow-y: auto; overflow-x: hidden;
      padding: 10px; display: flex; flex-direction: column; gap: 8px;
      transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.3s;
      z-index: 10;
    }
    .sidebar.hidden {
      transform: translateX(-100%); opacity: 0;
      position: absolute; pointer-events: none;
    }
    .sidebar h2 {
      text-align: center; color: #00d4ff; font-size: 1.1rem;
      padding: 4px 0 6px; border-bottom: 1px solid #0f3460; margin-bottom: 2px;
    }
    .panel {
      background: #16213e; border-radius: 8px; padding: 10px;
      border: 1px solid #0f3460;
    }
    .panel h3 {
      font-size: 0.78rem; color: #00d4ff; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer; user-select: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel h3::after { content: '\25B2'; font-size: 0.6rem; color: #555; transition: transform .2s; }
    .panel.collapsed h3::after { transform: rotate(180deg); }
    .panel.collapsed .panel-body { display: none; }
    label { display: block; font-size: 0.72rem; margin-bottom: 1px; color: #aaa; }
    select, input[type="file"] {
      width: 100%; padding: 4px 6px; border-radius: 5px; border: 1px solid #0f3460;
      background: #1a1a2e; color: #e0e0e0; font-size: 0.75rem; margin-bottom: 4px;
    }
    input[type="range"] { width: 100%; margin-bottom: 4px; accent-color: #00d4ff; height: 16px; }
    .range-row { display: flex; justify-content: space-between; align-items: center; }
    .range-row span { font-size: 0.65rem; color: #888; min-width: 34px; text-align: right; }
    button {
      padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer;
      font-size: 0.75rem; font-weight: 600; transition: all 0.15s;
    }
    .btn-primary { background: #00d4ff; color: #1a1a2e; }
    .btn-primary:hover { background: #00b8d4; }
    .btn-danger { background: #e94560; color: #fff; }
    .btn-danger:hover { background: #c73e54; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; }
    .btn-secondary:hover { background: #1a4a8a; }
    .btn-export { background: #2ecc71; color: #fff; }
    .btn-export:hover { background: #27ae60; }
    .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

    .pills-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .pill {
      padding: 3px 10px; border-radius: 14px; border: 1px solid #e94560;
      background: transparent; color: #e94560; cursor: pointer;
      font-size: 0.68rem; font-weight: 600; transition: all 0.15s;
    }
    .pill:hover, .pill.active { background: #e94560; color: #fff; }

    .radio-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    .radio-group label { display: flex; align-items: center; gap: 3px; font-size: 0.72rem; color: #e0e0e0; cursor: pointer; }
    .radio-group input[type="radio"] { accent-color: #00d4ff; }

    .geometry-grid { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .geo-btn {
      width: 34px; height: 34px; border-radius: 6px; border: 1px solid #0f3460;
      background: #1a1a2e; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.15s;
    }
    .geo-btn:hover, .geo-btn.active { border-color: #00d4ff; background: #0f3460; }
    .geo-btn svg { width: 18px; height: 18px; fill: none; stroke: #00d4ff; stroke-width: 2; }

    /* --- Main area --- */
    .main {
      flex: 1; display: flex; flex-direction: column;
      height: 100vh; position: relative; background: #111;
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px; background: #0f1b33; border-bottom: 1px solid #0f3460;
      min-height: 38px; z-index: 5;
      transition: opacity 0.3s, transform 0.3s;
    }
    .topbar.hidden { opacity: 0; pointer-events: none; height: 0; min-height: 0; padding: 0; overflow: hidden; }
    .topbar-left { display: flex; gap: 6px; align-items: center; }
    .topbar-right { display: flex; gap: 6px; align-items: center; }
    .topbar .transition-select {
      padding: 4px 8px; border-radius: 5px; border: 1px solid #0f3460;
      background: #1a1a2e; color: #e0e0e0; font-size: 0.75rem;
    }
    .topbar label { display: inline; font-size: 0.72rem; color: #888; margin-bottom: 0; }

    /* Canvas area */
    .canvas-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    canvas {
      max-width: 100%; max-height: 100%; display: block;
      image-rendering: auto; transition: opacity 0.4s;
    }

    /* Drop overlay */
    .drop-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,212,255,0.08); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      border: 3px dashed #00d4ff;
    }
    .drop-overlay.active { display: flex; }
    .drop-overlay .drop-label {
      font-size: 2rem; color: #00d4ff; font-weight: 700;
      text-shadow: 0 0 30px rgba(0,212,255,0.5);
      pointer-events: none;
    }

    /* Transition animations on canvas */
    .trans-fade { animation: transFade 0.7s ease; }
    @keyframes transFade { from { opacity: 0; } to { opacity: 1; } }

    .trans-zoom { animation: transZoom 0.6s cubic-bezier(.4,0,.2,1); }
    @keyframes transZoom { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .trans-slide-right { animation: transSlideR 0.5s ease; }
    @keyframes transSlideR { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .trans-slide-up { animation: transSlideU 0.5s ease; }
    @keyframes transSlideU { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .trans-rotate { animation: transRotate 0.7s cubic-bezier(.4,0,.2,1); }
    @keyframes transRotate { from { transform: rotate(180deg) scale(0); opacity: 0; } to { transform: rotate(0) scale(1); opacity: 1; } }

    .trans-flip { animation: transFlip 0.6s ease; }
    @keyframes transFlip { from { transform: perspective(800px) rotateY(90deg); opacity: 0; } to { transform: perspective(800px) rotateY(0); opacity: 1; } }

    .trans-glitch { animation: transGlitch 0.5s steps(8); }
    @keyframes transGlitch {
      0% { clip-path: inset(80% 0 0 0); opacity: 0; }
      15% { clip-path: inset(0 0 80% 0); }
      30% { clip-path: inset(40% 0 40% 0); }
      45% { clip-path: inset(0 80% 0 0); }
      60% { clip-path: inset(20% 0 20% 0); }
      75% { clip-path: inset(0); opacity: 0.6; }
      100% { clip-path: inset(0); opacity: 1; }
    }

    .trans-blur { animation: transBlur 0.6s ease; }
    @keyframes transBlur { from { filter: blur(30px); opacity: 0; } to { filter: blur(0); opacity: 1; } }

    /* Hint bar */
    .hint-bar {
      text-align: center; font-size: 0.65rem; color: #444;
      padding: 3px 8px; background: #0a0f1e;
      border-top: 1px solid #0f3460;
      transition: opacity 0.3s;
    }
    .hint-bar.hidden { opacity: 0; height: 0; padding: 0; overflow: hidden; }

    /* Scrollbar */
    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-track { background: #0f1b33; }
    .sidebar::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2>Noise Generator</h2>

    <!-- Upload & Noise -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Quelle & Noise</h3>
      <div class="panel-body">
        <label>Bild laden / Drag & Drop</label>
        <input type="file" id="upload" accept="image/*">
        <label>Noise-Typ</label>
        <select id="type">
          <option value="uniform">Uniform</option>
          <option value="gaussian">Gaussian</option>
          <option value="poisson">Poisson</option>
        </select>
        <label>Stärke</label>
        <div class="range-row">
          <input type="range" id="strength" min="1" max="100" value="20">
          <span id="strengthVal">20</span>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="applyNoise()">Noise</button>
          <button class="btn-danger" onclick="resetCanvas()">Reset</button>
        </div>
      </div>
    </div>

    <!-- Hue / Saturation -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Hue & Saturation</h3>
      <div class="panel-body">
        <label>Hue Rotation</label>
        <div class="range-row">
          <input type="range" id="hue" min="0" max="360" value="0">
          <span id="hueVal">0°</span>
        </div>
        <label>Saturation</label>
        <div class="range-row">
          <input type="range" id="saturation" min="0" max="300" value="100">
          <span id="satVal">100%</span>
        </div>
        <label>Brightness</label>
        <div class="range-row">
          <input type="range" id="brightness" min="0" max="300" value="100">
          <span id="brightVal">100%</span>
        </div>
        <label>Contrast</label>
        <div class="range-row">
          <input type="range" id="contrast" min="0" max="300" value="100">
          <span id="contrastVal">100%</span>
        </div>
        <button class="btn-primary" onclick="applyHueSat()" style="margin-top:4px">Anwenden</button>
      </div>
    </div>

    <!-- Effects -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Effekte</h3>
      <div class="panel-body">
        <label>Blur</label>
        <div class="range-row">
          <input type="range" id="blur" min="0" max="20" value="0" step="0.5">
          <span id="blurVal">0</span>
        </div>
        <label>Sepia</label>
        <div class="range-row">
          <input type="range" id="sepia" min="0" max="100" value="0">
          <span id="sepiaVal">0%</span>
        </div>
        <label>Grayscale</label>
        <div class="range-row">
          <input type="range" id="grayscale" min="0" max="100" value="0">
          <span id="grayVal">0%</span>
        </div>
        <button class="btn-primary" onclick="applyEffects()" style="margin-top:4px">Anwenden</button>
      </div>
    </div>

    <!-- Cool Sound FX -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Cool Sound FX</h3>
      <div class="panel-body">
        <label>Frequenz</label>
        <div class="range-row">
          <input type="range" id="coolFreq" min="80" max="2000" value="440">
          <span id="coolFreqVal">440Hz</span>
        </div>
        <label>Wellenform</label>
        <select id="coolWave">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
        <label>Dauer (ms)</label>
        <div class="range-row">
          <input type="range" id="coolDur" min="50" max="2000" value="300">
          <span id="coolDurVal">300ms</span>
        </div>
        <label>Distortion</label>
        <div class="range-row">
          <input type="range" id="coolDist" min="0" max="100" value="0">
          <span id="coolDistVal">0</span>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="playCool()">Abspielen</button>
          <button class="btn-secondary" onclick="playCoolAndApply()">+ Effekt</button>
        </div>
      </div>
    </div>

    <!-- Mirror -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Mirror</h3>
      <div class="panel-body">
        <div class="radio-group">
          <label><input type="radio" name="mirror" value="none" checked> Keins</label>
          <label><input type="radio" name="mirror" value="h"> Horizontal</label>
          <label><input type="radio" name="mirror" value="v"> Vertikal</label>
          <label><input type="radio" name="mirror" value="hv"> Beide</label>
        </div>
        <button class="btn-primary" onclick="applyMirror()">Mirror</button>
      </div>
    </div>

    <!-- Geometry Stamps -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Geometry Stamps</h3>
      <div class="panel-body">
        <div class="radio-group">
          <label><input type="radio" name="geobg" value="none" checked> Normal</label>
          <label><input type="radio" name="geobg" value="black"> Schwarz</label>
          <label><input type="radio" name="geobg" value="invert"> Invert</label>
        </div>
        <div class="geometry-grid">
          <button class="geo-btn" data-geo="triangle" title="Dreieck">
            <svg viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21"/></svg>
          </button>
          <button class="geo-btn" data-geo="circle" title="Kreis">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
          </button>
          <button class="geo-btn" data-geo="diamond" title="Raute">
            <svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12"/></svg>
          </button>
          <button class="geo-btn" data-geo="hexagon" title="Hexagon">
            <svg viewBox="0 0 24 24"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/></svg>
          </button>
          <button class="geo-btn" data-geo="star" title="Stern">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"/></svg>
          </button>
        </div>
        <label style="margin-top:4px">Größe</label>
        <div class="range-row">
          <input type="range" id="geoSize" min="20" max="400" value="120">
          <span id="geoSizeVal">120</span>
        </div>
      </div>
    </div>

    <!-- Glitch Effects -->
    <div class="panel">
      <h3 onclick="togglePanel(this)">Glitch Effects</h3>
      <div class="panel-body">
        <div class="pills-wrap">
          <button class="pill" data-glitch="rgbShift">RGB Shift</button>
          <button class="pill" data-glitch="scanlines">Scanlines</button>
          <button class="pill" data-glitch="pixelSort">Pixel Sort</button>
          <button class="pill" data-glitch="corrupt">Corrupt</button>
          <button class="pill" data-glitch="chromatic">Chromatic</button>
          <button class="pill" data-glitch="vhs">VHS</button>
          <button class="pill" data-glitch="datamosh">Datamosh</button>
          <button class="pill" data-glitch="interlace">Interlace</button>
          <button class="pill" data-glitch="jpegArtifact">JPEG Artifact</button>
          <button class="pill" data-glitch="bitcrush">Bitcrush</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <main class="main">
    <!-- Top bar with export & transition -->
    <div class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="btn-secondary" onclick="toggleSidebar()" title="Sidebar (H)">&#9776;</button>
        <label>Drop-Übergang:</label>
        <select class="transition-select" id="transitionType">
          <option value="trans-fade">Fade</option>
          <option value="trans-zoom">Zoom</option>
          <option value="trans-slide-right">Slide Right</option>
          <option value="trans-slide-up">Slide Up</option>
          <option value="trans-rotate">Rotate</option>
          <option value="trans-flip">Flip</option>
          <option value="trans-glitch">Glitch</option>
          <option value="trans-blur">Blur</option>
        </select>
      </div>
      <div class="topbar-right">
        <button class="btn-export" onclick="exportImage('png')">Export PNG</button>
        <button class="btn-export" onclick="exportImage('jpeg')">Export JPEG</button>
        <button class="btn-primary" onclick="saveProject()">Projekt speichern</button>
        <button class="btn-secondary" onclick="toggleFullscreen()" title="Fullscreen (F)">&#x26F6;</button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-area" id="canvasArea">
      <canvas id="canvas"></canvas>
    </div>

    <div class="hint-bar" id="hintBar">
      H = UI ein/aus &nbsp;&bull;&nbsp; F = Fullscreen &nbsp;&bull;&nbsp; Drag & Drop Bilder &nbsp;&bull;&nbsp; Klick = Stamp &nbsp;&bull;&nbsp; Auto-Save in localStorage
    </div>
  </main>

  <!-- Fullscreen Drop Overlay -->
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-label">Bild hier ablegen</div>
  </div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let originalImageData = null;
let activeGeo = null;
let audioCtx = null;
let uiHidden = false;

const STATE_KEY = "noiseGenState";

function el(id) { return document.getElementById(id); }
function val(id) { return el(id).value; }
function setVal(id, v) { if (v != null) el(id).value = v; }

// --- Panel collapse ---
function togglePanel(h3) { h3.closest('.panel').classList.toggle('collapsed'); }

// --- Sidebar toggle ---
function toggleSidebar() {
  el('sidebar').classList.toggle('hidden');
  saveState();
}

// --- Hide all UI (H key) ---
function toggleUI() {
  uiHidden = !uiHidden;
  el('sidebar').classList.toggle('hidden', uiHidden);
  el('topbar').classList.toggle('hidden', uiHidden);
  el('hintBar').classList.toggle('hidden', uiHidden);
  saveState();
}

// --- Fullscreen ---
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

// --- Export ---
function exportImage(format) {
  if (!canvas.width || !canvas.height) return;
  const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const ext = format === 'jpeg' ? 'jpg' : 'png';
  const quality = format === 'jpeg' ? 0.92 : undefined;
  const link = document.createElement('a');
  link.download = `noise-gen-export.${ext}`;
  link.href = canvas.toDataURL(mime, quality);
  link.click();
}

// --- Save project (trigger localStorage save + visual feedback) ---
function saveProject() {
  saveState();
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = 'Gespeichert!';
  btn.style.background = '#2ecc71';
  setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1200);
}

// --- Transition animation on canvas ---
function playTransition() {
  const t = val('transitionType');
  canvas.classList.remove('trans-fade','trans-zoom','trans-slide-right','trans-slide-up','trans-rotate','trans-flip','trans-glitch','trans-blur');
  void canvas.offsetWidth;
  canvas.classList.add(t);
  canvas.addEventListener('animationend', () => canvas.classList.remove(t), { once: true });
}

// --- Drag & Drop ---
const dropOverlay = el('dropOverlay');
let dragCounter = 0;

document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  if (e.dataTransfer.types.includes('Files')) dropOverlay.classList.add('active');
});
document.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); }
});
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImageFile(file);
});

function loadImageFile(file) {
  const img = new Image();
  img.onload = function() {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    playTransition();
    saveState();
  };
  img.src = URL.createObjectURL(file);
}

// --- State Management ---
function collectState() {
  return {
    type: val("type"), strength: val("strength"),
    hue: val("hue"), saturation: val("saturation"),
    brightness: val("brightness"), contrast: val("contrast"),
    blur: val("blur"), sepia: val("sepia"), grayscale: val("grayscale"),
    coolFreq: val("coolFreq"), coolWave: val("coolWave"),
    coolDur: val("coolDur"), coolDist: val("coolDist"),
    mirror: document.querySelector('input[name="mirror"]:checked')?.value || "none",
    geobg: document.querySelector('input[name="geobg"]:checked')?.value || "none",
    geoSize: val("geoSize"), activeGeo,
    transitionType: val("transitionType"),
    activeGlitches: [...document.querySelectorAll('.pill.active')].map(p => p.dataset.glitch),
    sidebarHidden: el('sidebar').classList.contains('hidden'),
    uiHidden,
    canvasData: canvas.width > 0 && canvas.height > 0 ? canvas.toDataURL("image/png") : null
  };
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(collectState())); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);

    setVal("type", s.type); setVal("strength", s.strength);
    setVal("hue", s.hue); setVal("saturation", s.saturation);
    setVal("brightness", s.brightness); setVal("contrast", s.contrast);
    setVal("blur", s.blur); setVal("sepia", s.sepia);
    setVal("grayscale", s.grayscale);
    setVal("coolFreq", s.coolFreq); setVal("coolWave", s.coolWave);
    setVal("coolDur", s.coolDur); setVal("coolDist", s.coolDist);
    setVal("geoSize", s.geoSize); setVal("transitionType", s.transitionType);

    const mr = document.querySelector(`input[name="mirror"][value="${s.mirror}"]`);
    if (mr) mr.checked = true;
    const gr = document.querySelector(`input[name="geobg"][value="${s.geobg}"]`);
    if (gr) gr.checked = true;

    if (s.sidebarHidden) el('sidebar').classList.add('hidden');
    if (s.uiHidden) { uiHidden = true; toggleUI(); uiHidden = true; }

    if (s.activeGlitches) {
      document.querySelectorAll('.pill').forEach(p => {
        if (s.activeGlitches.includes(p.dataset.glitch)) p.classList.add('active');
      });
    }
    if (s.activeGeo) selectGeo(s.activeGeo);

    if (s.canvasData) {
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      };
      img.src = s.canvasData;
    }
    updateAllDisplays();
  } catch(e) {}
}

function updateAllDisplays() {
  el("strengthVal").textContent = val("strength");
  el("hueVal").textContent = val("hue") + "°";
  el("satVal").textContent = val("saturation") + "%";
  el("brightVal").textContent = val("brightness") + "%";
  el("contrastVal").textContent = val("contrast") + "%";
  el("blurVal").textContent = val("blur");
  el("sepiaVal").textContent = val("sepia") + "%";
  el("grayVal").textContent = val("grayscale") + "%";
  el("coolFreqVal").textContent = val("coolFreq") + "Hz";
  el("coolDurVal").textContent = val("coolDur") + "ms";
  el("coolDistVal").textContent = val("coolDist");
  el("geoSizeVal").textContent = val("geoSize");
}

// --- Range display bindings ---
document.querySelectorAll('input[type="range"]').forEach(r => {
  r.addEventListener("input", () => { updateAllDisplays(); saveState(); });
});
document.querySelectorAll('select, input[type="radio"]').forEach(e => {
  e.addEventListener("change", saveState);
});

// --- File upload via input ---
el("upload").addEventListener("change", function(e) {
  if (e.target.files[0]) loadImageFile(e.target.files[0]);
});

function resetCanvas() {
  if (originalImageData) { ctx.putImageData(originalImageData, 0, 0); saveState(); }
}

// --- Noise ---
function gaussianRand(mu, sigma) {
  let u1 = Math.max(Math.random(), Number.MIN_VALUE), u2 = Math.random();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2) * sigma + mu;
}
function uniformRand(mu, sigma) { return mu + 2 * (Math.random() - 0.5) * sigma; }
function poissonRand(mu, sigma) {
  let z = gaussianRand(0, sigma), r = z + 2 * Math.sqrt(Math.max(mu + 3/8, 0));
  return (r*r - sigma*sigma)/4 - 3/8;
}

function applyNoise() {
  let img = ctx.getImageData(0,0,canvas.width,canvas.height), d = img.data;
  let t = val("type"), s = parseFloat(val("strength"));
  const fn = t==="uniform"?uniformRand:t==="gaussian"?gaussianRand:poissonRand;
  for(let i=0;i<d.length;i+=4) for(let c=0;c<3;c++) d[i+c]=Math.min(255,Math.max(0,fn(d[i+c],s)));
  ctx.putImageData(img,0,0); saveState();
}

// --- Hue/Sat ---
function applyHueSat() {
  if(!canvas.width||!canvas.height) return;
  const tmp=document.createElement("canvas"); tmp.width=canvas.width; tmp.height=canvas.height;
  const tc=tmp.getContext("2d");
  tc.filter=`hue-rotate(${val("hue")}deg) saturate(${val("saturation")}%) brightness(${val("brightness")}%) contrast(${val("contrast")}%)`;
  tc.drawImage(canvas,0,0); ctx.drawImage(tmp,0,0); saveState();
}

// --- Effects ---
function applyEffects() {
  if(!canvas.width||!canvas.height) return;
  const tmp=document.createElement("canvas"); tmp.width=canvas.width; tmp.height=canvas.height;
  const tc=tmp.getContext("2d");
  tc.filter=`blur(${val("blur")}px) sepia(${val("sepia")}%) grayscale(${val("grayscale")}%)`;
  tc.drawImage(canvas,0,0); ctx.drawImage(tmp,0,0); saveState();
}

// --- Cool Sound FX ---
function getAudioCtx() {
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playCool() {
  const ac=getAudioCtx(), freq=parseFloat(val("coolFreq")), wave=val("coolWave");
  const dur=parseFloat(val("coolDur"))/1000, distAmt=parseFloat(val("coolDist"));
  const osc=ac.createOscillator(); osc.type=wave;
  osc.frequency.setValueAtTime(freq,ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq*0.5,ac.currentTime+dur);
  const gain=ac.createGain();
  gain.gain.setValueAtTime(0.5,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+dur);
  let last=osc;
  if(distAmt>0){
    const ws=ac.createWaveShaper(), n=44100, curve=new Float32Array(n), a=distAmt*4;
    for(let i=0;i<n;i++){const x=(i*2)/n-1; curve[i]=((3+a)*x*20*(Math.PI/180))/(Math.PI+a*Math.abs(x));}
    ws.curve=curve; ws.oversample="4x"; last.connect(ws); last=ws;
  }
  last.connect(gain); gain.connect(ac.destination); osc.start(); osc.stop(ac.currentTime+dur);
}
function playCoolAndApply() {
  playCool(); if(!canvas.width||!canvas.height) return;
  const img=ctx.getImageData(0,0,canvas.width,canvas.height), d=img.data;
  const freq=parseFloat(val("coolFreq")), dist=parseFloat(val("coolDist"));
  const shift=Math.round((freq/440)*5+dist*0.3);
  for(let i=0;i<d.length;i+=4){
    d[i]=Math.min(255,d[i]+shift); d[i+1]=Math.max(0,d[i+1]-Math.floor(shift/2));
    d[i+2]=Math.min(255,Math.abs(d[i+2]+Math.sin(i*0.001)*shift*2));
  }
  ctx.putImageData(img,0,0); saveState();
}

// --- Mirror ---
function applyMirror() {
  if(!canvas.width||!canvas.height) return;
  const m=document.querySelector('input[name="mirror"]:checked').value;
  if(m==="none") return;
  const tmp=document.createElement("canvas"); tmp.width=canvas.width; tmp.height=canvas.height;
  tmp.getContext("2d").drawImage(canvas,0,0);
  ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
  if(m==="h"||m==="hv"){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
  if(m==="v"||m==="hv"){ctx.translate(0,canvas.height);ctx.scale(1,-1);}
  ctx.drawImage(tmp,0,0); ctx.restore(); saveState();
}

// --- Geometry Stamps ---
function selectGeo(type) {
  activeGeo=type;
  document.querySelectorAll('.geo-btn').forEach(b=>b.classList.toggle('active',b.dataset.geo===type));
  saveState();
}
document.querySelectorAll('.geo-btn').forEach(b=>b.addEventListener('click',()=>selectGeo(b.dataset.geo)));

canvas.addEventListener('click',(e)=>{
  if(!activeGeo||!canvas.width) return;
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  const cx=(e.clientX-rect.left)*sx, cy=(e.clientY-rect.top)*sy;
  const size=parseInt(val("geoSize"));
  const bg=document.querySelector('input[name="geobg"]:checked').value;
  if(bg==="black"){ctx.save();ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();}
  else if(bg==="invert"){
    const img=ctx.getImageData(0,0,canvas.width,canvas.height),d=img.data;
    for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
    ctx.putImageData(img,0,0);
  }
  ctx.save(); ctx.strokeStyle="#00d4ff"; ctx.lineWidth=2; ctx.fillStyle="rgba(0,212,255,0.15)";
  ctx.beginPath();
  switch(activeGeo){
    case"triangle":ctx.moveTo(cx,cy-size/2);ctx.lineTo(cx+size/2,cy+size/2);ctx.lineTo(cx-size/2,cy+size/2);ctx.closePath();break;
    case"circle":ctx.arc(cx,cy,size/2,0,Math.PI*2);break;
    case"diamond":ctx.moveTo(cx,cy-size/2);ctx.lineTo(cx+size/2,cy);ctx.lineTo(cx,cy+size/2);ctx.lineTo(cx-size/2,cy);ctx.closePath();break;
    case"hexagon":for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/2;const px=cx+(size/2)*Math.cos(a),py=cy+(size/2)*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();break;
    case"star":for(let i=0;i<10;i++){const a=(Math.PI/5)*i-Math.PI/2,r=i%2===0?size/2:size/4;const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();break;
  }
  ctx.fill(); ctx.stroke(); ctx.restore(); saveState();
});

// --- Glitch Effects ---
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{p.classList.toggle('active');applyGlitch(p.dataset.glitch);saveState();});
});

function applyGlitch(type){
  if(!canvas.width||!canvas.height) return;
  const img=ctx.getImageData(0,0,canvas.width,canvas.height), d=img.data;
  const w=canvas.width, h=canvas.height;
  switch(type){
    case"rgbShift":{const s=Math.floor(Math.random()*20)+5;for(let i=0;i<d.length;i+=4){const si=Math.min(i+s*4,d.length-4);d[i]=d[si];}break;}
    case"scanlines":{for(let y=0;y<h;y+=2)for(let x=0;x<w;x++){const i=(y*w+x)*4;d[i]*=0.7;d[i+1]*=0.7;d[i+2]*=0.7;}break;}
    case"pixelSort":{const row=Math.floor(Math.random()*h),px=[];for(let x=0;x<w;x++){const i=(row*w+x)*4;px.push([d[i],d[i+1],d[i+2],d[i+3]]);}px.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));for(let x=0;x<w;x++){const i=(row*w+x)*4;d[i]=px[x][0];d[i+1]=px[x][1];d[i+2]=px[x][2];d[i+3]=px[x][3];}break;}
    case"corrupt":{const ch=20+Math.floor(Math.random()*30);for(let c=0;c<ch;c++){const st=Math.floor(Math.random()*d.length),l=Math.floor(Math.random()*400);for(let i=st;i<Math.min(st+l,d.length);i++)d[i]=d[i]^(Math.random()*255);}break;}
    case"chromatic":{const o=Math.floor(Math.random()*10)+3;for(let i=0;i<d.length-o*8;i+=4)d[i+2]=d[i+o*8+2];break;}
    case"vhs":{for(let y=0;y<h;y++)if(Math.random()<0.03){const s=Math.floor(Math.random()*40)-20;for(let x=0;x<w;x++){const sx=Math.min(Math.max(x+s,0),w-1),si=(y*w+sx)*4,di=(y*w+x)*4;d[di]=d[si];d[di+1]=d[si+1];d[di+2]=d[si+2];}}break;}
    case"datamosh":{const bs=8;for(let i=0;i<30;i++){const sx=Math.floor(Math.random()*(w-bs)),sy=Math.floor(Math.random()*(h-bs)),dx=Math.floor(Math.random()*(w-bs)),dy=Math.floor(Math.random()*(h-bs));for(let by=0;by<bs;by++)for(let bx=0;bx<bs;bx++){const si=((sy+by)*w+(sx+bx))*4,di=((dy+by)*w+(dx+bx))*4;d[di]=d[si];d[di+1]=d[si+1];d[di+2]=d[si+2];}}break;}
    case"interlace":{for(let y=0;y<h;y+=4)for(let x=0;x<w;x++){const i=(y*w+x)*4;d[i+3]=120;}break;}
    case"jpegArtifact":{const bs=8;for(let by=0;by<h;by+=bs)for(let bx=0;bx<w;bx+=bs)if(Math.random()<0.15){const ri=(by*w+bx)*4,r=d[ri],g=d[ri+1],b=d[ri+2];for(let yy=by;yy<Math.min(by+bs,h);yy++)for(let xx=bx;xx<Math.min(bx+bs,w);xx++){const i=(yy*w+xx)*4;d[i]=r;d[i+1]=g;d[i+2]=b;}}break;}
    case"bitcrush":{const lv=4,st=256/lv;for(let i=0;i<d.length;i+=4){d[i]=Math.floor(d[i]/st)*st;d[i+1]=Math.floor(d[i+1]/st)*st;d[i+2]=Math.floor(d[i+2]/st)*st;}break;}
  }
  ctx.putImageData(img,0,0);
}

// --- Keyboard shortcuts ---
document.addEventListener('keydown',(e)=>{
  if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT'||document.activeElement.tagName==='TEXTAREA') return;
  if(e.key==='h'||e.key==='H') toggleUI();
  if(e.key==='f'||e.key==='F') toggleFullscreen();
});

window.addEventListener("beforeunload", saveState);
window.addEventListener("DOMContentLoaded", loadState);
</script>
